name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  # Run linting and static analysis
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1
          args: --timeout=5m --verbose

      - name: fmt check
        run: |
          if ! go fmt ./...; then
            echo "❌ Code formatting issues found. Run 'go fmt ./...'"
            exit 1
          fi

  # Run tests with coverage
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with race detection
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate coverage report
        run: go tool cover -func coverage.out | tail -1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  # Build and verify binary
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go build -ldflags="-s -w -X main.Version=dev -X main.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" -o ./bin/kwot -v
        env:
          CGO_ENABLED: 0

      - name: Verify binary
        run: |
          ./bin/kwot --version
          ./bin/kwot --help

      - name: Check binary size
        run: |
          SIZE=$(ls -lh ./bin/kwot | awk '{print $5}')
          echo "✓ Binary size: $SIZE"

  # Security scanning
  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          cache: true

      - name: Run vulnerability check with govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          echo "✓ No vulnerabilities detected"

      - name: Check for outdated dependencies
        run: |
          echo "🔍 Checking for outdated dependencies..."
          go list -u -m all | grep -E "^\S+\s+v.*\s+\[v" || echo "✓ All dependencies are up to date"

      - name: Verify dependency integrity
        run: |
          echo "🔐 Verifying module integrity..."
          go mod verify
          echo "✓ Module verification passed"

      - name: Generate SBOM (Software Bill of Materials)
        run: |
          echo "📋 Generating SBOM..."
          go list -m -json all > sbom.json
          echo "✓ SBOM generated (sbom.json)"
