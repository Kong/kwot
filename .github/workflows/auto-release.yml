name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
      - 'Makefile'
      - 'internal/**'
      - 'cmd/**'

permissions:
  contents: write
  packages: write

jobs:
  # Detect version change from Makefile
  detect-version:
    name: Detect Version Change
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      should_release: ${{ steps.detect.outputs.should_release }}
      previous_version: ${{ steps.detect.outputs.previous_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version from Makefile
        id: detect
        run: |
          # Extract current version from Makefile
          CURRENT_VERSION=$(grep -m1 '^VERSION=' Makefile | cut -d'=' -f2 | tr -d ' ')
          echo "version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          
          # Get previous commit's version
          PREVIOUS_VERSION=$(git show HEAD~1:Makefile 2>/dev/null | grep -m1 '^VERSION=' | cut -d'=' -f2 | tr -d ' ' || echo "")
          echo "previous_version=${PREVIOUS_VERSION}" >> $GITHUB_OUTPUT
          
          # Check if version changed
          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ] && [ ! -z "$PREVIOUS_VERSION" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "✓ Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "✗ No version change detected or first commit"
          fi

  # Create git tag and trigger release
  create-release-tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "Kong Bot"
          git config --global user.email "team@konghq.com"

      - name: Create and push tag
        run: |
          VERSION="v${{ needs.detect-version.outputs.version }}"
          
          # Check if tag already exists
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "✓ Tag $VERSION already exists"
            exit 0
          fi
          
          # Extract changelog entry for this version
          CHANGELOG_ENTRY=$(awk "/^## \[$VERSION\]/,/^## \[/" CHANGELOG.md | head -n -1 | tail -n +2)
          
          # Create annotated tag
          git tag -a "$VERSION" \
            -m "Release kwot $VERSION" \
            -m "" \
            -m "$CHANGELOG_ENTRY"
          
          # Push tag to origin
          git push origin "$VERSION"
          
          echo "✓ Created and pushed tag: $VERSION"
          echo "✓ Release workflow will be triggered by tag push"

  # Notify
  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [detect-version, create-release-tag]
    if: needs.detect-version.outputs.should_release == 'true'
    steps:
      - name: Release Summary
        run: |
          echo "🚀 Release Tag Created!"
          echo "========================"
          echo "Version: v${{ needs.detect-version.outputs.version }}"
          echo "Previous: ${{ needs.detect-version.outputs.previous_version }}"
          echo ""
          echo "The release workflow will:"
          echo "  1. Validate version format"
          echo "  2. Run all tests and linting"
          echo "  3. Build binaries for all platforms"
          echo "  4. Create GitHub release with artifacts"
          echo ""
          echo "Monitor progress in: Actions → Release workflow"

