version: 2
updates:
  # Go dependencies - weekly updates
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    commit-message:
      prefix: "deps:"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"