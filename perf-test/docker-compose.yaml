# Specify which Kong image to run
x-kong-image: &kong-image
  image: ${KONG_DOCKER_IMAGE:-kong/kong-gateway:3.6.1.7-rhel}
  platform: linux/amd64

# Kong license configuration
x-kong-license: &kong-license
  KONG_LICENSE_DATA: ${KONG_LICENSE_DATA:?err}

# Kong database configuration
x-kong-db-config: &kong-db-config
  KONG_DATABASE: postgres
  KONG_PG_HOST: db
  KONG_PG_DATABASE: kong
  KONG_PG_USER: kong
  KONG_PG_PASSWORD: kong
  KONG_PASSWORD: password

# Common config values
x-kong-common-config: &kong-common-config
  KONG_VITALS: "on"
  KONG_LOG_LEVEL: "debug"
  KONG_PLUGINS: "bundled"
  KONG_AUDIT_LOG: "on"

# Common configuration for Kong containers
x-kong-container-common: &kong-container-common
  <<: *kong-image
  healthcheck:
    test: ["CMD", "kong", "health"]
    interval: 3s
    timeout: 3s
    retries: 10
    start_period: 3s
  restart: on-failure
  tmpfs:
    - /tmp

# Common volumes for Kong containers
x-kong-volumes: &kong-volumes
  - ./certs:/data/certs

networks:
  kong-net:
    name: kong-net
    driver: bridge

services:
  kong-migrations:
    <<: *kong-image
    networks:
      - kong-net
    command: "kong migrations bootstrap"
    environment:
      <<: [*kong-license, *kong-db-config]
    restart: on-failure

  kong-migrations-upgrade:
    <<: *kong-image
    profiles: ["upgrade", "everything"]
    networks:
      - kong-net
    command: "kong migrations up"
    environment:
      <<: [*kong-license, *kong-db-config]
    restart: on-failure

  kong-migrations-finish:
    <<: *kong-image
    profiles: ["upgrade-finish", "everything"]
    networks:
      - kong-net
    command: "kong migrations finish"
    environment:
      <<: [*kong-license, *kong-db-config]
    restart: on-failure

  kong-gateway-cp:
    <<: *kong-container-common
    container_name: kong-gateway-cp
    deploy:
      replicas: 1
    mem_limit: 2g
    cpus: 4
    networks:
      - kong-net
    volumes: *kong-volumes
    user: "${KONG_USER:-kong}"
    ports:
      - 8001:8001
      - 8002:8002
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: [*kong-license, *kong-db-config, *kong-common-config]
      KONG_PROXY_LISTEN: "off"
      KONG_ADMIN_LISTEN: "[::0]:8001, 0.0.0.0:8001"
      KONG_ADMIN_GUI_LISTEN: "[::0]:8002, 0.0.0.0:8002"
      KONG_ROLE: "control_plane"
      KONG_CLUSTER_MTLS: "shared"
      KONG_CLUSTER_CERT: "/data/certs/cluster-cert.pem"
      KONG_CLUSTER_CERT_KEY: "/data/certs/cluster-key.pem"
      KONG_NGINX_WORKER_PROCESSES: 8
      KONG_NGINX_WORKER_CONNECTIONS: 8192
      KONG_NGINX_MULTI_ACCEPT: "on"

  db:
    image: postgres:14-alpine
    platform: linux/x86_64
    command:
      [
        "postgres",
        "-c", "max_connections=2000",
        "-c", "shared_buffers=2GB",
        "-c", "effective_cache_size=4GB",
        "-c", "work_mem=10MB",
        "-c", "maintenance_work_mem=256MB",
        "-c", "random_page_cost=1.1",
        "-c", "synchronous_commit=off"
      ]
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
    ports:
      - "5432:5432"
    networks:
      - kong-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 3s
      timeout: 3s
      retries: 3
    restart: on-failure
    stdin_open: true
    tty: true

  kong-gateway-dp:
    <<: *kong-container-common
    container_name: kong-gateway-dp
    deploy:
      replicas: 1
    mem_limit: 2g
    cpus: 4
    networks:
      - kong-net
    volumes: *kong-volumes
    user: "${KONG_USER:-kong}"
    ports:
      - 8000:8000
      - 8100:8100
    depends_on:
      kong-gateway-cp:
        condition: service_healthy
    environment:
      <<: [*kong-license, *kong-common-config]
      KONG_PROXY_LISTEN: "[::0]:8000, [::0]:8443 ssl , 0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "off"
      KONG_ADMIN_GUI_LISTEN: "off"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_ROLE: "data_plane"
      KONG_CLUSTER_MTLS: "shared"
      KONG_CLUSTER_CERT: "/data/certs/cluster-cert.pem"
      KONG_CLUSTER_CERT_KEY: "/data/certs/cluster-key.pem"
      KONG_CLUSTER_CONTROL_PLANE: "kong-gateway-cp:8005"
      KONG_CLUSTER_TELEMETRY_ENDPOINT: "kong-gateway-cp:8006"
      KONG_DATABASE: "off"
      KONG_NGINX_WORKER_PROCESSES: 4